<!-- board.html — 단일 주문판 (가게 드로어 · 팀 알약 · 팀원 그리드 · 2열 메뉴 · 하단 CTA) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('주문', ~{:: #content})}">
<body>
  <div id="content" th:fragment="content" class="pb-28"
       th:with="base=@{/{c}/{v}/{t}(c=${category}, v=${vendor}, t=${team})}">

    <!-- 이미 주문한 사람 목록 (중복 감지용) -->
    <script th:inline="javascript">window.mukjaOrdered = /*[[${orderedPersons}]]*/ [];</script>

    <!-- 가게 드로어 (커피/점심 > 가게 중첩) -->
    <div id="cat-backdrop" onclick="toggleDrawer()"></div>
    <aside id="cat-drawer">
      <div class="drawer-title">먹자! 🍽️</div>
      <div th:each="g : ${drawerGroups}">
        <div class="drawer-group" th:text="${g.name}">☕ 커피</div>
        <a th:each="v : ${g.vendors}"
           th:href="@{/{c}/{v}/{t}(c=${g.id}, v=${v.id}, t=${team})}"
           class="drawer-item" th:classappend="${v.id == vendor} ? 'on'"
           th:text="${v.name}">가게</a>
        <div th:if="${g.vendors.isEmpty()}" class="drawer-item soon">
          <span>준비중</span><span class="soon-tag">soon</span>
        </div>
      </div>
    </aside>

    <!-- 헤더 -->
    <header class="board-head">
      <div class="board-head-top">
        <button class="icon-btn" onclick="toggleDrawer()" aria-label="가게 선택">☰</button>
        <div class="board-title">
          <span th:text="${placeName}">KT그룹희망나눔재단</span>
          <span class="cup" th:text="${category == 'coffee'} ? '☕' : '🍱'">☕</span>
        </div>
        <span class="session-badge"><span class="dot"></span><b th:text="${teamName}">ICE</b> 세션</span>
      </div>
      <div class="board-sub">
        <span th:text="${category == 'coffee'} ? '오늘의 커피를 주문해 주세요!' : '오늘의 점심을 주문해 주세요!'">오늘의 커피를 주문해 주세요!</span>
        <span th:if="${closeAt}" id="countdown" class="deadline-badge" th:data-close="${closeAt}">마감</span>
      </div>
    </header>

    <!-- 팀 알약 -->
    <nav class="team-pills">
      <a th:each="t : ${teams}" class="team-pill" th:classappend="${t.id == team} ? 'on'"
         th:href="@{/{c}/{v}/{t2}(c=${category}, v=${vendor}, t2=${t.id})}" th:text="${t.name}">팀</a>
    </nav>

    <!-- 주문자 선택 (가로 슬라이드 알약) -->
    <section class="ident">
      <div class="ident-row">
        <span class="ident-label">주문자 선택</span>
        <span class="ordered-chip">✓ 이미 주문함</span>
      </div>
      <div class="member-scroll">
        <div class="member-pills" id="member-pills">
          <button th:each="m : ${members}" type="button" class="member-chip"
                  th:attr="data-name=${m}" onclick="selectMember(this)" th:text="${m}">팀원</button>
          <button type="button" class="member-chip etc" data-name="__etc__" onclick="selectMember(this)">기타…</button>
        </div>
      </div>
      <input id="person" class="name-input" placeholder="이름 직접 입력" style="display:none">
    </section>

    <!-- 주문/집계 토글 -->
    <div class="seg">
      <button id="tab-order" type="button" class="seg-btn seg-on" onclick="showView('order')">주문</button>
      <button id="tab-agg" type="button" class="seg-btn"
              th:hx-get="${base} + '/status'" hx-target="#agg-view" hx-swap="innerHTML"
              onclick="showView('agg')">집계</button>
    </div>

    <!-- 주문 뷰 -->
    <div id="order-view">
      <nav th:if="${!subCategories.isEmpty()}" class="menu-tabs">
        <button th:each="sub, i : ${subCategories}" type="button" class="menu-tab"
                th:classappend="${i.first} ? 'on'" onclick="selectTab(this)"
                th:hx-get="${base} + '/menu?cat=' + ${sub.id}" hx-target="#menu-grid"
                th:text="${sub.name}">커피</button>
      </nav>
      <div th:if="${!subCategories.isEmpty()}" id="menu-grid"
           th:hx-get="${base} + '/menu?cat=' + ${subCategories[0].id}"
           hx-trigger="load" hx-swap="innerHTML"></div>
      <div th:if="${subCategories.isEmpty()}" class="empty-state">메뉴 준비중이에요 🛠️</div>
    </div>

    <!-- 집계 뷰 (집계 토글 시 panel fragment가 swap됨) -->
    <div id="agg-view" class="hidden"></div>

    <!-- 하단 CTA -->
    <div class="cta-bar" id="cart-bar">
      <button class="cta-cancel" id="cancel-btn" type="button" onclick="cancelOrder()" style="display:none">주문 취소</button>
      <button class="cta-submit" id="submit-btn" type="button" onclick="submitOrder()" disabled>메뉴를 선택하세요</button>
    </div>

    <dialog id="opt-dialog" class="modal modal-bottom"><div id="opt-content" class="modal-box"></div></dialog>
  </div>
</body>
</html>
