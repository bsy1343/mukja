<!-- menu-grid.html — 카테고리별 카드 그리드 fragment -->
<div th:fragment="grid" xmlns:th="http://www.thymeleaf.org" class="menu-grid">
  <button th:each="item : ${subCategory.items}"
          class="menu-card" type="button" th:attr="data-item-id=${item.id}"
          th:hx-get="@{/{c}/{v}/{t}/menu/{i}/options(c=${category}, v=${vendor}, t=${team}, i=${item.id})}"
          hx-target="#opt-content" onclick="document.getElementById('opt-dialog').showModal()">
    <span class="card-qty" style="display:none">0</span>
    <div class="mc-name" th:text="${item.name}">아메리카노</div>
    <div class="mc-price" th:text="${#numbers.formatInteger(item.price,0,'COMMA')} + '원'">1,600원</div>
    <span th:if="${item.fixedTemp == 'ice'}" class="mc-tag ice">ICE</span>
    <span th:if="${item.fixedTemp == 'hot'}" class="mc-tag hot">HOT</span>
    <span th:if="${item.fixedTemp == null and item.options.contains('temp')}" class="mc-tag both">HOT/ICE</span>
  </button>
</div>
