<!-- option-modal.html — 옵션 선택 하단시트 모달 fragment -->
<div th:fragment="modal" xmlns:th="http://www.thymeleaf.org"
     th:attr="data-item=${item.id},data-price=${item.price},data-name=${item.name},data-fixed-temp=${item.fixedTemp}">
  <h3 class="font-bold text-lg" th:text="${item.name}">아메리카노</h3>
  <div class="text-sm opacity-70" th:text="${#numbers.formatInteger(item.price,0,'COMMA')} + '원~'">1,600원~</div>
  <form id="opt-form" class="py-2 space-y-3">
    <div th:each="optKey : ${item.options}" th:with="def=${optionDefs.get(optKey)}"
         th:if="${!(optKey == 'temp' and item.fixedTemp != null)}"
         class="opt-group" th:attr="data-optkey=${optKey},data-required=${def.required}">
      <div class="text-sm font-medium">
        <span th:text="${def.label}">옵션</span>
        <span th:if="${def.required}" class="req">필수</span>
      </div>
      <!-- 단일 선택: 알약 버튼 (가격 인라인) -->
      <div th:if="${def.type == 'single'}" class="flex flex-wrap gap-1 mt-1">
        <label th:each="ch : ${def.choices}" class="btn btn-sm opt-pill" th:attr="data-extra=${ch.extra}">
          <input type="radio" class="hidden" th:name="${optKey}" th:value="${ch.id}">
          <span th:text="${ch.name} + (${ch.extra > 0} ? ' (+' + ${ch.extra} + ')' : '')">HOT</span>
        </label>
      </div>
      <!-- 토글 -->
      <label th:if="${def.type == 'toggle'}" class="flex items-center gap-2 mt-1">
        <input type="checkbox" class="toggle" th:name="${optKey}" th:attr="data-extra=${def.extra}">
        <span class="text-sm opacity-70" th:if="${def.extra > 0}" th:text="'(+' + ${def.extra} + ')'"></span>
      </label>
      <!-- 카운터: 스테퍼 -->
      <div th:if="${def.type == 'counter'}" class="flex items-center gap-3 mt-1">
        <button type="button" class="step-btn" onclick="stepCounter(this,-1)">−</button>
        <input type="number" min="0" th:max="${def.max}" value="0" readonly
               class="step-num" th:name="${optKey}" th:attr="data-extra=${def.extra}">
        <button type="button" class="step-btn" onclick="stepCounter(this,1)">+</button>
        <span class="text-xs opacity-60" th:text="'+' + ${def.extra} + '원/개'">+500원/개</span>
      </div>
    </div>
  </form>
  <div class="modal-action">
    <button class="btn" type="button" onclick="document.getElementById('opt-dialog').close()">취소</button>
    <button id="modal-add" class="btn btn-primary" type="button" onclick="addToCart()">담기</button>
  </div>
</div>
